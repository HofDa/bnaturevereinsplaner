name: Quality and security boundaries
on:
  push:
  pull_request:
  # Nightly: all browser suites on mobile too (pushes and pull requests run a layout-sensitive subset).
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports: ['1025:1025', '8025:8025']
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bnature_test
          POSTGRES_USER: bnature_test
          POSTGRES_PASSWORD: ci-database-only-password
        ports: ['55440:5432']
        options: >-
          --health-cmd "pg_isready -U bnature_test -d bnature_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Configure isolated test database
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL=postgres://bnature_test:ci-database-only-password@127.0.0.1:55440/bnature_test
          AUTH_SECRET=ci-tests-only-secret-with-more-than-32-characters
          APP_URL=http://localhost:5174
          PORT=3002
          NODE_ENV=test
          ENV
      - run: bun audit --audit-level=moderate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run test:integration
      - run: bun run build
      - run: bun run openapi && git diff --exit-code -- docs/api/openapi.json
      - name: Verify Node runtime
        run: cp .env.test .env && bun run test:node

  # Runs in parallel with verify; desktop and mobile on separate runners.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    services:
      mailpit:
        image: axllent/mailpit:v1.27.4
        ports: ['1025:1025', '8025:8025']
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bnature_test
          POSTGRES_USER: bnature_test
          POSTGRES_PASSWORD: ci-database-only-password
        ports: ['55440:5432']
        options: >-
          --health-cmd "pg_isready -U bnature_test -d bnature_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Configure isolated test database
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL=postgres://bnature_test:ci-database-only-password@127.0.0.1:55440/bnature_test
          AUTH_SECRET=ci-tests-only-secret-with-more-than-32-characters
          APP_URL=http://localhost:5174
          PORT=3002
          NODE_ENV=test
          ENV
      - run: bunx playwright install --with-deps chromium
      - name: Browser suites (${{ matrix.project }})
        run: >-
          bun run test:e2e --project=${{ matrix.project }}
          ${{ matrix.project == 'mobile' && github.event_name != 'schedule' && '--mobile-subset' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
